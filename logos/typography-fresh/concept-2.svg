<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" role="img" aria-labelledby="t2-title">
  <title id="t2-title">Typography Concept 2 - Stacked Editorial</title>
  <g id="icon">
    <rect x="70" y="96" width="220" height="320" rx="28" fill="#ddd9d5" stroke="#9a948d" stroke-width="8"/>
    <text x="180" y="230" text-anchor="middle" fill="#2a2725" font-size="132" font-weight="700" letter-spacing="-4" font-family="Georgia, Times New Roman, serif">A</text>
    <text x="180" y="350" text-anchor="middle" fill="#2a2725" font-size="132" font-weight="700" letter-spacing="-2" font-family="Georgia, Times New Roman, serif">R</text>
  </g>
  <g id="wordmark">
    <text x="352" y="224" fill="#2a2725" font-size="108" font-weight="700" letter-spacing="2" font-family="Georgia, Times New Roman, serif">ABDUL</text>
    <line x1="354" y1="252" x2="920" y2="252" stroke="#9a948d" stroke-width="8" stroke-linecap="round"/>
    <text x="352" y="334" fill="#9a948d" font-size="78" font-weight="700" letter-spacing="7" font-family="Georgia, Times New Roman, serif">RAHMAN</text>
  </g>
</svg>
