<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" role="img" aria-labelledby="t1-title">
  <title id="t1-title">Typography Concept 1 - Monogram + Wordmark</title>
  <g id="icon">
    <rect x="64" y="88" width="336" height="336" rx="72" fill="#26221f"/>
    <text x="232" y="315" text-anchor="middle" fill="#f2efea" font-size="186" font-weight="700" letter-spacing="-10" font-family="Space Grotesk, Arial, Helvetica, sans-serif">AR</text>
    <rect x="146" y="336" width="172" height="12" rx="6" fill="#8c857d"/>
  </g>
  <g id="wordmark">
    <text x="452" y="258" fill="#26221f" font-size="124" font-weight="700" letter-spacing="-4" font-family="Space Grotesk, Arial, Helvetica, sans-serif">Abdul</text>
    <text x="452" y="342" fill="#8c857d" font-size="72" font-weight="600" letter-spacing="8" font-family="Space Grotesk, Arial, Helvetica, sans-serif">RAHMAN</text>
  </g>
</svg>
